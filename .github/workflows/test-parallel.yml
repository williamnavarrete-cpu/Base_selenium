name: 🧪 Tests Paralelos - Selenium + Behave + Allure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: "🧪 Test: ${{ matrix.tag }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        tag:
          - "@HU-2"
          - "@HU-3"

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚙️ Crear archivo .env
        run: |
          echo "EXECUTION_TYPE=manager" > .env
          echo "BROWSER=chrome" >> .env
          echo "URL=https://hakatools.hakalab.com" >> .env
          echo "TIME_IMPLICITY=10" >> .env
          echo "EXECUTOR_NAME=GitHub Actions" >> .env
          echo "EXECUTOR_BUILD_NAME=Run #${{ github.run_number }}" >> .env
          echo "EXECUTOR_TYPE=github" >> .env

      - name: 🚀 Ejecutar escenarios con tag ${{ matrix.tag }}
        run: |
          behave \
            -f allure_behave.formatter:AllureFormatter \
            -o allure-results \
            --tags="${{ matrix.tag }}" \
            --no-capture \
            ./features 2>&1 | tee behave-output.txt
        continue-on-error: true

      - name: 📋 Mostrar output de Behave
        if: always()
        run: cat behave-output.txt

      - name: 🔍 Analizar resultados
        if: always()
        run: |
          echo "=== Archivos generados ==="
          ls -la allure-results/ || echo "No hay resultados"
          echo "=== Contenido de result JSONs ==="
          for f in allure-results/*-result.json; do
            echo "--- $f ---"
            python3 -c "
          import json
          data = json.load(open('$f'))
          print(f\"  Name: {data.get('name', 'N/A')}\")
          print(f\"  Status: {data.get('status', 'N/A')}\")
          print(f\"  Message: {data.get('statusDetails', {}).get('message', 'N/A')[:300]}\")
          print(f\"  Trace: {data.get('statusDetails', {}).get('trace', 'N/A')[:500]}\")
          " 2>&1 || true
          done

      - name: 📤 Subir resultados Allure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ strategy.job-index }}
          path: allure-results/
          retention-days: 5

  report:
    name: "📊 Generar Reporte Allure"
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: 📥 Descargar resultados de todos los jobs
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: 📊 Generar reporte Allure
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_report: allure-report

      - name: 📤 Subir reporte HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
